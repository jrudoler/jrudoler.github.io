{%- assign media_image = site.data.media.images[include.name] -%}
{%- assign largest = media_image.variants | last -%}
<img src="{{ largest.url | relative_url }}"
  srcset="{% for variant in media_image.variants %}{{ variant.url | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
  sizes="{{ include.sizes | default: '100vw' }}"
  width="{{ include.width | default: largest.width }}" height="{{ include.height | default: largest.height }}"
  alt="{{ include.alt | escape }}"
  loading="{{ include.loading | default: 'lazy' }}" decoding="async"{% if include.priority %} fetchpriority="{{ include.priority }}"{% endif %}>
