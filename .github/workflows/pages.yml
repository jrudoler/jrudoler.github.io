name: Deploy website with generated CV

on:
  push:
    branches: [master, cv-artifacts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build website content from master, including on CV updates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the website
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
      - name: Fetch the latest generated CV
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: cv-artifacts
          path: _generated-cv
          persist-credentials: false
          sparse-checkout: RudolerCV.pdf
          sparse-checkout-cone-mode: false
      - name: Install the generated PDF at the existing CV URL
        run: |
          set -euo pipefail
          test -s _generated-cv/RudolerCV.pdf
          test "$(head -c 5 _generated-cv/RudolerCV.pdf)" = '%PDF-'
          install -m 644 _generated-cv/RudolerCV.pdf _site/files/RudolerCV.pdf
          cmp _generated-cv/RudolerCV.pdf _site/files/RudolerCV.pdf
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
